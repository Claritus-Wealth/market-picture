# Minato Wealth - Market Picture daily build.
# Weekdays after the London close (and on demand): fetches every series in
# instruments.json, appends what is new to the history under data/, builds the daily
# view (view/index.html) from that history, and commits both.
# The history is committed before the job reports failure, so a bad day never loses
# the series that did arrive; a broken view never stops the history being committed.
# The view folder alone (not the history) is then published to GitHub Pages:
# https://claritus-wealth.github.io/market-picture/ (noindex; decided 27 Oct 2026).
# A broken view is never published: the last good page stays up.
name: Daily build

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      view_failed: ${{ steps.view.outputs.failed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (yfinance is required)
        run: pip install --quiet -r requirements.txt

      - name: Fetch every series and append to the history
        id: build
        run: python3 build_daily.py

      - name: Build the daily view from the history
        id: view
        run: |
          if python3 build_view.py; then echo "failed=0" >> "$GITHUB_OUTPUT"
          else echo "failed=1" >> "$GITHUB_OUTPUT"; fi

      - name: Commit the history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ view/
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Daily build - $(TZ=Europe/London date +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Package the view for publishing
        if: steps.view.outputs.failed == '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: view/

      - name: Fail loudly if any series failed
        if: steps.build.outputs.failed != '0'
        run: |
          echo "::error::${{ steps.build.outputs.failed }} series failed - see data/report.md"
          exit 1

      - name: Fail loudly if the view did not build
        if: always() && steps.view.outputs.failed == '1'
        run: |
          echo "::error::build_view.py failed - the history was committed, the view was not updated"
          exit 1

  publish:
    needs: build
    # publish whenever the view built, even if some series failed (the page marks them)
    if: ${{ !cancelled() && needs.build.outputs.view_failed == '0' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish the view to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
